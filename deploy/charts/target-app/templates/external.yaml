apiVersion: v1
kind: Service
metadata:
  name: external
  labels:
    app: external
spec:
  type: ClusterIP
  selector:
    app: external
  ports:
    - name: https
      port: {{ .Values.services.external.port }}
      targetPort: https
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external
  labels:
    app: external
spec:
  replicas: {{ .Values.services.external.replicas | default 1 }}
  selector:
    matchLabels:
      app: external
  template:
    metadata:
      labels:
        app: external
    spec:
      containers:
        - name: external
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.services.external.command | nindent 12 }}
          ports:
            - name: https
              containerPort: {{ .Values.services.external.port }}
          env:
            - name: PORT
              value: {{ .Values.services.external.port | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: https
              {{- if .Values.services.external.tls }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: https
              {{- if .Values.services.external.tls }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
