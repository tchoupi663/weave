replicaCount: 1

image:
  repository: weave-app
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

config:
  hubbleRelayAddr: hubble-relay.kube-system.svc.cluster.local:80
  watchNamespace: weave
  window: 5m

serviceAccount:
  create: true
  name: ""
  automount: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 192Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
