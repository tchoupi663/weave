apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weave.fullname" . }}
  labels:
    {{- include "weave.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  # One replica owns the SQLite/DuckDB files on a ReadWriteOnce PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "weave.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "weave.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "weave.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: 10
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: weave
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: HUBBLE_RELAY_ADDR
              value: {{ .Values.config.hubbleRelayAddr | quote }}
            - name: WATCH_NAMESPACE
              value: {{ .Values.config.watchNamespace | quote }}
            - name: WINDOW
              value: {{ .Values.config.window | quote }}
            - name: WEB_DIR
              value: "/app/web/dist"
            {{- if and .Values.persistence.enabled .Values.config.dataDir }}
            - name: DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
            {{- end }}
            {{- if .Values.argocd.url }}
            - name: ARGOCD_URL
              value: {{ .Values.argocd.url | quote }}
            - name: ARGOCD_APP
              value: {{ .Values.argocd.app | quote }}
            - name: ARGOCD_NAMESPACE
              value: {{ .Values.argocd.namespace | quote }}
            {{- if .Values.argocd.tokenSecret }}
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.argocd.tokenSecret | quote }}
                  key: {{ .Values.argocd.tokenKey | default "token" | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.config.dataDir | default "/data" | quote }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "weave.fullname" . }}-data
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
