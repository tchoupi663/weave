apiVersion: apps/v1
kind: Deployment
metadata:
  name: weave-inventory
  labels:
    app.kubernetes.io/name: weave-inventory
    app.kubernetes.io/part-of: weave
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Single writer: SQLite on a ReadWriteOnce PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: weave-inventory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weave-inventory
        app.kubernetes.io/part-of: weave
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: weave-inventory
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: WATCH_NAMESPACE
              value: {{ .Values.config.watchNamespace | quote }}
            - name: DATA_DIR
              value: "/data"
            - name: LIVE_URL
              value: {{ .Values.config.liveURL | quote }}
            {{- if .Values.argocd.url }}
            - name: ARGOCD_URL
              value: {{ .Values.argocd.url | quote }}
            - name: ARGOCD_APP
              value: {{ .Values.argocd.app | quote }}
            - name: ARGOCD_NAMESPACE
              value: {{ .Values.argocd.namespace | quote }}
            {{- if .Values.argocd.tokenSecret }}
            - name: ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.argocd.tokenSecret | quote }}
                  key: {{ .Values.argocd.tokenKey | default "token" | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.global.securityContext | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.name }}
