apiVersion: apps/v1
kind: Deployment
metadata:
  name: weave-live
  labels:
    app.kubernetes.io/name: weave-live
    app.kubernetes.io/part-of: weave
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: weave-live
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weave-live
        app.kubernetes.io/part-of: weave
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: weave-live
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: HUBBLE_RELAY_ADDR
              value: {{ .Values.config.hubbleRelayAddr | quote }}
            - name: WATCH_NAMESPACE
              value: {{ .Values.config.watchNamespace | quote }}
            - name: WINDOW
              value: {{ .Values.config.window | quote }}
            - name: HISTORY_URL
              value: "http://weave-history:8080"
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.global.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
