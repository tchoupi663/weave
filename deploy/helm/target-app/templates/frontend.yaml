apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: 
    app: frontend
spec:
  type: NodePort
  ports:
    - port: {{ .Values.frontend.port }}
      nodePort: {{ .Values.frontend.nodePort }}
      targetPort: 443
      protocol: TCP
      name: https
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
  name: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - image: {{ .Values.frontend.image.imageName }}:{{ .Values.frontend.image.tag }}
        name: frontend
        ports:
        - containerPort: {{ .Values.frontend.containerPort }}
          name: https
        resources: 
          requests:
            cpu: "100m"
            memory: "250Mi"
          limits:
            cpu: "250m"
            memory: "500Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
          initialDelaySeconds: 10
          periodSeconds: 10


