apiVersion: v1
kind: Service
metadata:
  name: {{ include "target-app.fullname" . }}
  labels: 
    {{- include "target-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "target-app.selectorLabels" . | nindent 4 }}
