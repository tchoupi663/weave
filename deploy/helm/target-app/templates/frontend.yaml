apiVersion: v1
kind: Service
metadata:
  name: {{ include "target-app.fullname" . }}
  labels: 
    {{- include "target-app.labels" . | nindent 4 }}
    app: frontend
spec:
  type: NodePort
  ports:
    - port: {{ .Values.frontend.port }}
      nodePort: {{ .Values.frontend.nodePort }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app: frontend
