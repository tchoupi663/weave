apiVersion: v1
kind: Service
metadata:
  labels:
    app: external
  name: external
spec:
  ports:
  - name: http
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app: external
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: external
  name: external
spec:
  selector:
    matchLabels:
      app: external
  template:
    metadata:
      labels:
        app: external
    spec:
      containers:
      - image: weave-target-app:dev
        imagePullPolicy: IfNotPresent
        name: weave-target-app
        command: ["/app/external"]
        ports:
        - containerPort: 8443
          protocol: TCP
        resources: 
          requests:
            cpu: "100m"
            memory: "250Mi"
          limits:
            cpu: "250m"
            memory: "500Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 443
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 443
          initialDelaySeconds: 10
          periodSeconds: 10