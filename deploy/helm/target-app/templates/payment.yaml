apiVersion: v1
kind: Service
metadata:
  labels:
    app: payment
  name: payment
spec:
  ports:
  - name: http
    port: 8084
    protocol: TCP
    targetPort: 8084
  selector:
    app: payment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payment
  name: payment
spec:
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
      - image: weave-target-app:dev
        imagePullPolicy: IfNotPresent
        name: weave-target-app
        command: ["/app/payment"]       
        env:
          - name: PORT
            value: "8084"
          - name: EXTERNAL_URL
            value: https://external:8443 # 
          - name: EXTERNAL_INSECURE
            value: "true"
        ports:
        - containerPort: 8084
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "250Mi"
          limits:
            cpu: "250m"
            memory: "500Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10