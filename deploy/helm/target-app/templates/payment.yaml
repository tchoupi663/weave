apiVersion: v1
kind: Service
metadata:
  labels:
    app: payment
  name: payment
spec:
  ports:
  - name: 80-8084
    port: 8084
    protocol: TCP
    targetPort: 8084
  selector:
    app: payment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: payment
  name: payment
spec:
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
      - image: weave-target-app:dev
        imagePullPolicy: IfNotPresent
        name: weave-target-app
        command: ["/app/catalog"]
        ports:
        - containerPort: 8084
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "250Mi"
          limits:
            cpu: "250m"
            memory: "500Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 443
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 443
          initialDelaySeconds: 10
          periodSeconds: 10