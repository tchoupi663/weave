id: orders-replicas-zero
description: Orders deployment is scaled to zero
template: deployment_manifest_error
fault_duration_seconds: 240
recovery_seconds: 120
injection:
  mechanism: scale_zero
  target: deployment/orders
ground_truth:
  root_cause_workloads: [orders]
  failure_mode: bad_deployment
  affected_route: POST /api/orders
  affected_edge: workload:weave/gateway->workload:weave/orders:8083
  expected_initial_region_workloads: [gateway, orders, frontend]
  expected_region_contains_root_cause: true
  expected_expansion: false
