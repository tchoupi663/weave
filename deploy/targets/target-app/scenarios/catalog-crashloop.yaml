id: catalog-crashloop
description: Catalog image crash-loops due to a code error
fault_duration_seconds: 240
recovery_seconds: 120
injection:
  mechanism: image_swap
  target: catalog
  image: weave-target-app:crashy
ground_truth:
  root_cause_workloads: [catalog]
  failure_mode: bad_deployment
  affected_route: GET /api/products
  affected_edge: workload:weave/gateway->workload:weave/catalog:8082
  expected_initial_region_workloads: [gateway, frontend]
  expected_region_contains_root_cause: false
  expected_expansion: true
