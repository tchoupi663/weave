id: external-payment-outage
description: External Payment Provider pods are unavailable
fault_duration_seconds: 240
recovery_seconds: 120
injection:
  mechanism: scale_zero
  target: deployment/external
ground_truth:
  root_cause_workloads: [external]
  failure_mode: dependency_unavailable
  affected_route: POST /api/payments
  affected_edge: workload:weave/payment->workload:weave/external:8443
  expected_initial_region_workloads: [gateway, payment, frontend]
  expected_region_contains_root_cause: false
  expected_expansion: true
