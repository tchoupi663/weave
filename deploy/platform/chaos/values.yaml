controllerManager:
  replicaCount: 1
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {cpu: 300m, memory: 512Mi}

chaosDaemon:
  runtime: containerd
  socketPath: /run/containerd/containerd.sock
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}

dashboard:
  create: false
