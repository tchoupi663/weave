apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: bench-catalog-http-500
  namespace: weave
spec:
  mode: all
  selector:
    namespaces: [weave]
    labelSelectors: {app: catalog}
  target: Response
  port: 8082
  method: GET
  path: /api/products
  replace:
    code: 500
  duration: "4m"
