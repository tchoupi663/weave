global:
  domain: argocd.local

configs:
  params:
    server.insecure: true
  cm:
    accounts.weave: apiKey
  rbac:
    policy.csv: |
      p, role:weave-reader, applications, get, */*, allow
      g, weave, role:weave-reader

server:
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

controller:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

repoServer:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

applicationSet:
  enabled: false

notifications:
  enabled: false

dex:
  enabled: false

redis-ha:
  enabled: false

redis:
  enabled: true
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
