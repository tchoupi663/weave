<text x="728.9" y="338.0" font-size="11" fill="#d08a3a" text-anchor="start" font-weight="600">127</text>
<text x="246.0" y="338.0" font-size="9" fill="#6b7785" text-anchor="end" font-weight="400"></text>
<text x="232.0" y="394.0" font-size="11.5" fill="#11161d" text-anchor="end" font-weight="500">Wall time (s)</text>
<rect x="250.0" y="374.0" width="358.2" height="18.0" fill="#2f6fb3" rx="2" opacity="0.9"/>
<text x="618.2" y="388.0" font-size="11" fill="#2f6fb3" text-anchor="start" font-weight="600">425s</text>
<text x="246.0" y="388.0" font-size="9" fill="#6b7785" text-anchor="end" font-weight="400"></text>
<rect x="250.0" y="398.0" width="468.7" height="18.0" fill="#d08a3a" rx="2" opacity="0.9"/>
<text x="728.7" y="412.0" font-size="11" fill="#d08a3a" text-anchor="start" font-weight="600">557s</text>
<text x="246.0" y="412.0" font-size="9" fill="#6b7785" text-anchor="end" font-weight="400"></text>
<text x="250.0" y="470.0" font-size="11" fill="#11161d" text-anchor="start" font-weight="400">Unconfined cost +505k more total tokens and +126k more fresh tokens,</text>
<text x="250.0" y="488.0" font-size="11" fill="#11161d" text-anchor="start" font-weight="400">for the same 5/5 root-cause and failure-mode accuracy.</text>
