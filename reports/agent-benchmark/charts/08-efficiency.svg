<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="560" viewBox="0 0 1020 560" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">
<rect width="1020" height="560" fill="#ffffff"/>
<text x="30" y="40" font-size="19" font-weight="600" fill="#11161d">Cost per correct diagnosis</text>
<text x="30" y="62" font-size="12.5" fill="#6b7785">Totals across the five scenarios. Both arms scored 5/5 on root cause, so lower cost is strictly better.</text>
<text x="232.0" y="172.0" font-size="11.5" fill="#11161d" text-anchor="end" font-weight="500">Total tokens</text>
<rect x="250.0" y="152.0" width="320.6" height="18.0" fill="#2f6fb3" rx="2" opacity="0.9"/>
<text x="580.6" y="166.0" font-size="11" fill="#2f6fb3" text-anchor="start" font-weight="600">2,405k</text>
<text x="246.0" y="166.0" font-size="9" fill="#6b7785" text-anchor="end" font-weight="400"></text>
<rect x="250.0" y="176.0" width="388.0" height="18.0" fill="#d08a3a" rx="2" opacity="0.9"/>
<text x="648.0" y="190.0" font-size="11" fill="#d08a3a" text-anchor="start" font-weight="600">2,910k</text>
<text x="246.0" y="190.0" font-size="9" fill="#6b7785" text-anchor="end" font-weight="400"></text>
<text x="232.0" y="246.0" font-size="11.5" fill="#11161d" text-anchor="end" font-weight="500">Fresh tokens</text>
<rect x="250.0" y="226.0" width="214.3" height="18.0" fill="#2f6fb3" rx="2" opacity="0.9"/>
<text x="474.3" y="240.0" font-size="11" fill="#2f6fb3" text-anchor="start" font-weight="600">223k</text>
<text x="246.0" y="240.0" font-size="9" fill="#6b7785" text-anchor="end" font-weight="400"></text>
<rect x="250.0" y="250.0" width="334.9" height="18.0" fill="#d08a3a" rx="2" opacity="0.9"/>
<text x="594.9" y="264.0" font-size="11" fill="#d08a3a" text-anchor="start" font-weight="600">349k</text>
<text x="246.0" y="264.0" font-size="9" fill="#6b7785" text-anchor="end" font-weight="400"></text>
<text x="232.0" y="320.0" font-size="11.5" fill="#11161d" text-anchor="end" font-weight="500">Tool calls</text>
<rect x="250.0" y="300.0" width="446.8" height="18.0" fill="#2f6fb3" rx="2" opacity="0.9"/>
<text x="706.8" y="314.0" font-size="11" fill="#2f6fb3" text-anchor="start" font-weight="600">121</text>
