# Continuous traffic for the agent benchmark. Faults are injected by weave-bench.
run:
  id: agent-benchmark
  seed: 42
  target: https://localhost:8443
  expected_topology: expected-topology.yaml
  duration: 4h
  concurrency: 50
  ramp: 10s
  think_time: {min: 1s, max: 5s}
  mix: {bounce: 30, browse: 50, order: 20}
  accounts: {pool: 2000}
  reset: true
  tls: {insecure_skip_verify: true}
